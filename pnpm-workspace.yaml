packages:
  - "apps/*"
  - "modules/*"
  - "libs/*"
  - "utils/*"
  - "clis/*"
  - "plugins/*"
  - "databases/*"
allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  better-sqlite3: true
  nx: true
  prisma: true
  unrs-resolver: true
