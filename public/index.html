<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects</title>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --ink: #161a22;
        --muted: #5b6475;
        --line: #e2e5ec;
        --accent: #3b5bdb;
        --accent-soft: #e8edff;
        --icon-bg: #f0f2f7;
        --shadow:
          0 1px 2px rgba(20, 28, 48, 0.05),
          0 8px 24px -12px rgba(20, 28, 48, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1218;
          --surface: #161b24;
          --ink: #e8ebf2;
          --muted: #9aa3b5;
          --line: #252c3a;
          --accent: #8ea2ff;
          --accent-soft: #1d2540;
          --icon-bg: #1e2431;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          'Segoe UI',
          Inter,
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header {
        padding: 72px 0 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw + 1rem, 3.25rem);
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 700;
      }
      .lead {
        margin: 0;
        max-width: 56ch;
        color: var(--muted);
        font-size: 1.0625rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin: 36px 0 28px;
      }
      .search {
        flex: 1 1 260px;
        position: relative;
      }
      .search svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .search input {
        width: 100%;
        height: 44px;
        padding: 0 14px 0 42px;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .search input::placeholder {
        color: var(--muted);
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .seg button {
        height: 36px;
        padding: 0 14px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button[aria-pressed='true'] {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .count {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.9rem;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .search input:focus-visible {
        outline-offset: 0;
        border-color: var(--accent);
      }

      .grid {
        display: grid;
        gap: 16px;
        padding-bottom: 72px;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        color: inherit;
        text-decoration: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          transform 0.15s;
      }
      .card:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow);
        transform: translateY(-2px);
      }
      .top {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .icon {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--icon-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .icon img {
        width: 30px;
        height: 30px;
        object-fit: contain;
      }
      .icon span {
        font-weight: 700;
        font-size: 1.25rem;
        color: var(--accent);
      }
      .name {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 650;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .root {
        margin: 2px 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        flex: 1;
      }
      .desc.empty {
        font-style: italic;
        opacity: 0.7;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.85rem;
      }
      .badge {
        padding: 2px 10px;
        border-radius: 999px;
        font-weight: 500;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .deps {
        color: var(--muted);
      }
      .open {
        color: var(--accent);
        font-weight: 600;
      }
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 14px;
      } /* whole card is the link */

      .state {
        padding: 64px 0;
        text-align: center;
        color: var(--muted);
      }
      .state strong {
        display: block;
        color: var(--ink);
        margin-bottom: 4px;
        font-size: 1.05rem;
      }
      .state code {
        background: var(--icon-bg);
        padding: 2px 6px;
        border-radius: 5px;
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 24px 0 40px;
        color: var(--muted);
        font-size: 0.875rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
        .card:hover {
          transform: none;
        }
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1 id="title">Projects</h1>
        <p class="lead" id="lead">
          API documentation for every package and app in the workspace.
        </p>
      </header>

      <div class="toolbar">
        <label class="search">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search projects"
            aria-label="Search projects"
            autocomplete="off"
          />
        </label>
        <div
          class="seg"
          id="filters"
          role="group"
          aria-label="Filter by type"
        ></div>
        <span class="count" id="count" aria-live="polite"></span>
      </div>

      <main>
        <div class="grid" id="grid"></div>
        <div class="state" id="state" hidden></div>
      </main>
    </div>

    <footer>
      <div class="wrap" id="meta">Generated from projects.json</div>
    </footer>

    <script>
      (() => {
        // ---- Configuration -------------------------------------------------------
        const DATA_URL = 'projects.json'; // nx graph --file output
        const DOCS_BASE = ''; // docs live next to this page: <root>/index.html
        const ICON_PATH = 'assets/favicon.svg'; // <root>/assets/favicon.svg
        const TYPE_LABELS = { app: 'Apps', lib: 'Libraries', e2e: 'E2E' };
        const TYPE_SINGULAR = { app: 'App', lib: 'Library', e2e: 'E2E' };

        const $ = (id) => document.getElementById(id);
        const grid = $('grid'),
          state = $('state'),
          filtersEl = $('filters');
        let projects = [],
          activeType = 'all';

        // ---- Data ----------------------------------------------------------------
        function normalize(json) {
          const graph = json.graph || json;
          const nodes = graph.nodes || {};
          const deps = graph.dependencies || {};
          return Object.values(nodes)
            .filter((n) => n && n.data && n.data.root !== undefined)
            .map((n) => {
              const d = n.data,
                meta = d.metadata || {};
              const root = String(d.root).replace(/^\/+|\/+$/g, '');
              const internal = (deps[n.name] || []).filter(
                (e) => nodes[e.target],
              );
              return {
                name: n.name,
                root,
                type: n.type || d.projectType || 'lib',
                description: (meta.description || d.description || '').trim(),
                tags: d.tags || [],
                deps: new Set(internal.map((e) => e.target)).size,
                href: `${DOCS_BASE}${root}/`,
                icon: `${DOCS_BASE}${root}/${ICON_PATH}`,
              };
            })
            .sort((a, b) => a.name.localeCompare(b.name));
        }

        // ---- Rendering -----------------------------------------------------------
        function el(tag, cls, text) {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text !== undefined) e.textContent = text;
          return e;
        }

        function card(p) {
          const a = el('a', 'card');
          a.href = p.href;
          a.setAttribute('aria-label', `${p.name} documentation`);

          const top = el('div', 'top');
          const icon = el('div', 'icon');
          const img = new Image();
          img.alt = '';
          img.loading = 'lazy';
          img.src = p.icon;
          img.onerror = () => {
            icon.replaceChildren(
              el(
                'span',
                '',
                (p.name.replace(/^@[^/]+\//, '')[0] || '?').toUpperCase(),
              ),
            );
          };
          icon.appendChild(img);

          const titles = el('div');
          titles.append(
            el('h2', 'name', p.name),
            el('p', 'root', p.root || '.'),
          );
          top.append(icon, titles);

          const desc = el(
            'p',
            p.description ? 'desc' : 'desc empty',
            p.description || 'No description provided.',
          );

          const foot = el('div', 'foot');
          const left = el('div');
          left.style.cssText = 'display:flex;gap:10px;align-items:center';
          left.append(el('span', 'badge', TYPE_SINGULAR[p.type] || p.type));
          if (p.deps)
            left.append(
              el(
                'span',
                'deps',
                `${p.deps} ${p.deps === 1 ? 'dependency' : 'dependencies'}`,
              ),
            );
          foot.append(left, el('span', 'open', 'View docs'));

          a.append(top, desc, foot);
          return a;
        }

        function render() {
          const q = $('q').value.trim().toLowerCase();
          const list = projects.filter(
            (p) =>
              (activeType === 'all' || p.type === activeType) &&
              (!q ||
                [p.name, p.root, p.description, ...p.tags]
                  .join(' ')
                  .toLowerCase()
                  .includes(q)),
          );
          grid.replaceChildren(...list.map(card));
          $('count').textContent = `${list.length} of ${projects.length}`;
          state.hidden = list.length > 0;
          if (!list.length) {
            state.replaceChildren(
              el('strong', '', 'No projects match'),
              document.createTextNode('Try a different search or filter.'),
            );
          }
        }

        function buildFilters() {
          const types = [...new Set(projects.map((p) => p.type))];
          const opts = [
            ['all', 'All'],
            ...types.map((t) => [t, TYPE_LABELS[t] || t]),
          ];
          filtersEl.replaceChildren(
            ...opts.map(([value, label]) => {
              const b = el('button', '', label);
              b.type = 'button';
              b.setAttribute('aria-pressed', String(value === activeType));
              b.onclick = () => {
                activeType = value;
                filtersEl
                  .querySelectorAll('button')
                  .forEach((x) =>
                    x.setAttribute('aria-pressed', String(x === b)),
                  );
                render();
              };
              return b;
            }),
          );
          filtersEl.hidden = types.length < 2;
        }

        function fail(err) {
          $('count').textContent = '';
          grid.replaceChildren();
          state.hidden = false;
          const code = el('code', '', DATA_URL);
          state.replaceChildren(
            el('strong', '', 'Could not load projects'),
            document.createTextNode('Check that '),
            code,
            document.createTextNode(
              ' is served next to this page. ' +
                (err && err.message ? `(${err.message})` : ''),
            ),
          );
        }

        // ---- Boot ----------------------------------------------------------------
        $('q').addEventListener('input', render);

        fetch(DATA_URL, { cache: 'no-cache' })
          .then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then((json) => {
            projects = normalize(json);
            if (!projects.length) throw new Error('no projects found in file');
            buildFilters();
            render();
          })
          .catch(fail);
      })();
    </script>
  </body>
</html>
