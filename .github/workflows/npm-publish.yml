name: npm-publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Aenode
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            pnpm nx run-many -t prisma:generate 
            pnpm nx run-many -t build     --projects="tag:lib:*,tag:app:cli,tag:app:plugin"
            pnpm nx run-many -t lint      --projects="tag:lib:*,tag:app:cli,tag:app:plugin"
            pnpm nx run-many -t typecheck --projects="tag:lib:*,tag:app:cli,tag:app:plugin"
            pnpm nx run-many -t test      --projects="tag:lib:*,tag:app:cli,tag:app:plugin"

      - name: Publish
        run: pnpm nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Finish
        run: pnpm exec nx fix-ci
        if: always()
